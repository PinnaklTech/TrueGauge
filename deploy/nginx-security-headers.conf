# TrueGage — security headers (include from each server block)
# Usage inside server { ... }:
#   include /var/www/TrueGauge/deploy/nginx-security-headers.conf;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Start with Report-Only; switch to Content-Security-Policy after validating in browser
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.thetruegage.com" always;

# Optional login rate limit (api vhost):
# limit_req_zone $binary_remote_addr zone=tg_login:10m rate=5r/m;
# location = /api/auth/login { limit_req zone=tg_login burst=5 nodelay; proxy_pass http://127.0.0.1:8000; ... }

# App SPA (app.thetruegage.com) must use history fallback for /workspace/{slug}/… :
#   location / { try_files $uri $uri/ /index.html; }
# See deploy/APP_WORKSPACE_URLS.md
