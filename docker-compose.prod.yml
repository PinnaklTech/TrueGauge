services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENVIRONMENT: production
      MASTER_ADMIN_PASSCODE: ${MASTER_ADMIN_PASSCODE}
      SYSTEM_SMTP_HOST: ${SYSTEM_SMTP_HOST:-}
      SYSTEM_SMTP_PORT: ${SYSTEM_SMTP_PORT:-587}
      SYSTEM_SMTP_USERNAME: ${SYSTEM_SMTP_USERNAME:-}
      SYSTEM_SMTP_PASSWORD: ${SYSTEM_SMTP_PASSWORD:-}
      SYSTEM_SMTP_FROM_EMAIL: ${SYSTEM_SMTP_FROM_EMAIL:-}
      SYSTEM_SMTP_FROM_NAME: ${SYSTEM_SMTP_FROM_NAME:-TrueGage}
      SYSTEM_SMTP_USE_TLS: ${SYSTEM_SMTP_USE_TLS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ODOO_MODEL: ${ODOO_MODEL:-maintenance.equipment}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      REMINDER_TICK_SECRET: ${REMINDER_TICK_SECRET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-truegage}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_REGION: ${R2_REGION:-auto}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    restart: unless-stopped

  reminder-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENVIRONMENT: production
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.reminder_worker
    restart: unless-stopped

volumes:
  pgdata:
