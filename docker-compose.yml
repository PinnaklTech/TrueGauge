services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-truegauge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-truegauge}
      POSTGRES_DB: ${POSTGRES_DB:-truegauge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-truegauge} -d ${POSTGRES_DB:-truegauge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-truegauge}:${POSTGRES_PASSWORD:-truegauge}@db:5432/${POSTGRES_DB:-truegauge}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-long-random-string}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MASTER_ADMIN_PASSCODE: ${MASTER_ADMIN_PASSCODE:-000000}
      SYSTEM_SMTP_HOST: ${SYSTEM_SMTP_HOST:-}
      SYSTEM_SMTP_PORT: ${SYSTEM_SMTP_PORT:-587}
      SYSTEM_SMTP_USERNAME: ${SYSTEM_SMTP_USERNAME:-}
      SYSTEM_SMTP_PASSWORD: ${SYSTEM_SMTP_PASSWORD:-}
      SYSTEM_SMTP_FROM_EMAIL: ${SYSTEM_SMTP_FROM_EMAIL:-}
      SYSTEM_SMTP_FROM_NAME: ${SYSTEM_SMTP_FROM_NAME:-TrueGage}
      SYSTEM_SMTP_USE_TLS: ${SYSTEM_SMTP_USE_TLS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8080,http://localhost:8081,http://127.0.0.1:5173,http://127.0.0.1:8080,http://127.0.0.1:8081}
      ODOO_MODEL: ${ODOO_MODEL:-maintenance.equipment}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      REMINDER_TICK_SECRET: ${REMINDER_TICK_SECRET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-truegage}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_REGION: ${R2_REGION:-auto}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  reminder-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-truegauge}:${POSTGRES_PASSWORD:-truegauge}@db:5432/${POSTGRES_DB:-truegauge}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-long-random-string}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: python -m app.reminder_worker

volumes:
  pgdata:
